[versions]
gradle = "8.6.1"
kotlin = "2.1.21"
kotlin-coroutines = "1.10.2"
fastjson2 = "2.0.59.android8"
fastjson2-kotlin = "2.0.21.android"
annotation = "1.10.0"

[plugins]
# kotlin
org-jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }


[libraries]
#kotlin
kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }

gradle = { module = "com.android.tools.build:gradle", version.ref = "gradle" }

# fastJson
fastjson2 = { group = "com.alibaba.fastjson2", name = "fastjson2", version.ref = "fastjson2" }
fastjson2-kotlin = { group = "com.alibaba.fastjson2", name = "fastjson2-kotlin", version.ref = "fastjson2-kotlin" }
annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }